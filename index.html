<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một điều dành riêng cho em 💖</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background: linear-gradient(-45deg, #ff758c, #ff7eb3, #fad0c4, #fbc2eb);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  position:relative;
  width:90%;
  max-width:420px;
  padding:50px 35px;
  border-radius:30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,0.35);
  text-align:center;
  color:white;
  animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:10px;
}

.subtitle{
  font-size:14px;
  opacity:0.85;
  margin-bottom:35px;
}

#qrcode{
  padding:20px;
  background:white;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  display:inline-block;
  transition:0.4s;
}

#qrcode:hover{
  transform:scale(1.05);
}

.footer{
  margin-top:25px;
  font-size:12px;
  opacity:0.7;
}

/* Soft floating particles */
.particle{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  opacity:0.5;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-120vh) scale(1.5);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Một điều anh muốn em thấy 💌</h1>
  <div class="subtitle">Hãy quét mã dưới đây</div>

  <div id="qrcode"></div>

  <div class="footer">Dành riêng cho em ❤️</div>
</div>

<script>
// 🔥 THAY LINK NÀY
var link = "https://jovial-lokum-a504d7.netlify.app/letter.html";

new QRCode(document.getElementById("qrcode"), {
    text: link,
    width: 230,
    height: 230
});

/* Create soft particles */
function createParticle(){
  const p = document.createElement("div");
  p.classList.add("particle");
  p.innerHTML = "💖";
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (6 + Math.random()*6) + "s";
  document.body.appendChild(p);
  setTimeout(()=>{p.remove()},12000);
}

setInterval(createParticle,1200);
</script>

</body>
</html>
