<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dành Riêng Cho Em 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
  background:linear-gradient(-45deg,#ff758c,#ff7eb3,#fad0c4,#fbc2eb);
  background-size:400% 400%;
  animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card{
  width:100%;
  max-width:700px;
  padding:60px 50px;
  border-radius:30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 80px rgba(0,0,0,0.35);
  color:white;
}

h2{
  text-align:center;
  margin-bottom:35px;
  font-weight:600;
}

#text{
  white-space:pre-line;
  line-height:1.9;
  font-size:16px;
  font-weight:300;
  min-height:300px;
}

.cursor{
  display:inline-block;
  width:3px;
  background:white;
  margin-left:3px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,50%,100%{opacity:1;}
  25%,75%{opacity:0;}
}

button{
  display:block;
  margin:40px auto 0;
  padding:15px 35px;
  border:none;
  border-radius:50px;
  font-size:15px;
  cursor:pointer;
  background:white;
  color:#ff4d88;
  transition:0.3s;
}

button:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<div class="card">
  <h2>Gửi em 💌</h2>

  <div id="text"></div><span class="cursor"></span>

  <button onclick="playAudio()">Nghe anh nói 💖</button>

  <audio id="voice">
    <source src="voice.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const message = `Gửi em – người anh thương nhất trong những ngày tháng này,

14/2 lại đến rồi. Anh không giỏi nói lời hoa mỹ, cũng chẳng quen viết những điều quá ngọt ngào, nhưng hôm nay anh chỉ muốn nói thật lòng mình. Cảm ơn em đã xuất hiện, đã ở đó, đã kiên nhẫn với một người đôi khi khô khan, bận rộn và hơi cứng đầu như anh.

Có em, mọi ngày bình thường bỗng trở nên đặc biệt hơn. Một tin nhắn buổi sáng, một câu hỏi thăm đơn giản, hay chỉ là biết rằng cuối ngày vẫn có một người để nghĩ đến – vậy thôi cũng đủ làm tim anh ấm lại.

Anh không hứa những điều quá lớn lao. Anh chỉ hứa sẽ luôn cố gắng tốt hơn mỗi ngày, để xứng đáng với tình cảm em dành cho anh. Dù phía trước còn nhiều việc phải lo, nhiều ước mơ phải theo đuổi, anh vẫn mong trong hành trình đó có em bên cạnh.

Chúc người anh thương một ngày Valentine thật dịu dàng. Và nếu được chọn lại, anh vẫn sẽ chọn gặp em giữa rất nhiều người ngoài kia.

Thương em. 💙`;

let i = 0;
const speed = 30; // càng nhỏ càng viết nhanh

function typeWriter(){
  if(i < message.length){
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  }
}

typeWriter();

function playAudio(){
  document.getElementById("voice").play();
}
</script>

</body>
</html>
